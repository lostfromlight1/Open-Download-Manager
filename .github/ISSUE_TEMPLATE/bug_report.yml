name: Bug report
description: Report a defect with enough context to reproduce it
title: "bug: "
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What went wrong?
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system and version
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version or commit
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs
      description: Remove cookies, tokens, authorization headers, and private URLs.
  - type: textarea
    id: http-client
    attributes:
      label: Direct HTTP client comparison
      description: Say whether the issue also happens with a direct HTTP client such as curl.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: This report does not include private download URLs, cookies, tokens, or personal files.
          required: true
