name: Release Windows

# Cut a release: git tag v0.5.0 && git push origin v0.5.0
# Or run workflow_dispatch and enter a tag name to create/update the Release.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.5.0)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-windows-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows-installer:
    name: Build + publish Windows NSIS
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      CI: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve tag
        id: meta
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Using tag $TAG"

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.1.0

      - name: Install NSIS
        run: |
          choco install nsis -y
          echo "C:\Program Files (x86)\NSIS" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build desktop binary
        working-directory: apps/desktop
        run: wails3 build

      # Optional Authenticode (v1.0 final). Skipped when secrets are absent.
      - name: Sign executable (optional)
        if: ${{ secrets.WINDOWS_CERT_BASE64 != '' && secrets.WINDOWS_CERT_PASSWORD != '' }}
        working-directory: apps/desktop
        shell: pwsh
        env:
          WINDOWS_CERT_BASE64: ${{ secrets.WINDOWS_CERT_BASE64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP "odm-code-sign.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERT_BASE64))
          $signtool = "${env:ProgramFiles(x86)}\Windows Kits\10\bin\x64\signtool.exe"
          if (-not (Test-Path $signtool)) {
            $signtool = (Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter signtool.exe | Select-Object -First 1).FullName
          }
          & $signtool sign /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 /f $pfx /p $env:WINDOWS_CERT_PASSWORD "bin\odm.exe"

      - name: Package per-user NSIS installer
        working-directory: apps/desktop
        run: wails3 task windows:create:nsis:installer INSTALL_SCOPE=user

      - name: Stage release assets
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release-assets | Out-Null
          $installer = Get-ChildItem "apps/desktop/bin/odm-*-installer.exe" | Select-Object -First 1
          if (-not $installer) { throw "NSIS installer not found under apps/desktop/bin" }
          Copy-Item $installer.FullName "release-assets/$($installer.Name)"
          $hash = (Get-FileHash $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -Path "release-assets/SHA256SUMS.txt" -Value "$hash  $($installer.Name)`n" -NoNewline
          Get-Content "release-assets/SHA256SUMS.txt"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: Open Download Manager ${{ steps.meta.outputs.tag }}
          generate_release_notes: true
          files: |
            release-assets/*
          body: |
            ## Windows installer (0.5.0 / v1.0 prep)

            - Per-user install (no admin/UAC): `%LOCALAPPDATA%\Programs\…`
            - Finish page can launch ODM
            - First-run setup wizard for download folder (+ optional browser / YouTube)

            See [docs/GETTING_STARTED.md](https://github.com/lostfromlight1/Open-Download-Manager/blob/main/docs/GETTING_STARTED.md).

            **SmartScreen:** builds may be unsigned until 1.0.0 — use More info → Run anyway only for official Release assets.

            Verify: `SHA256SUMS.txt` next to the installer.

            ### Signing secrets (maintainers)

            Optional repository secrets for Authenticode on the exe before packaging:
            - `WINDOWS_CERT_BASE64` — base64-encoded `.pfx`
            - `WINDOWS_CERT_PASSWORD` — PFX password
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
