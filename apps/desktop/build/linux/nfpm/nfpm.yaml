# nfpm config for Linux packages (deb/rpm/arch). Paths assume APP_NAME=odm.
# Docs: https://nfpm.goreleaser.com

name: "odm"
arch: ${GOARCH}
platform: "linux"
version: "0.5.0"
section: "net"
priority: "optional"
maintainer: "Open Download Manager contributors <noreply@opendownloadmanager.app>"
description: "Open-source download manager desktop shell"
vendor: "Open Download Manager contributors"
homepage: "https://github.com/lostfromlight1/Open-Download-Manager"
license: "MIT"
release: "1"

contents:
  - src: "./bin/odm"
    dst: "/usr/local/bin/odm"
  - src: "./build/appicon.png"
    dst: "/usr/share/icons/hicolor/128x128/apps/odm.png"
  - src: "./build/linux/odm.desktop"
    dst: "/usr/share/applications/odm.desktop"

# Default dependencies for the GTK4 + WebKitGTK 6.0 stack (Ubuntu 24.04+ / Debian 13+)
depends:
  - libgtk-4-1
  - libwebkitgtk-6.0-4

overrides:
  rpm:
    depends:
      - gtk4
      - webkitgtk6.0

  archlinux:
    depends:
      - gtk4
      - webkitgtk-6.0

scripts:
  postinstall: "./build/linux/nfpm/scripts/postinstall.sh"
