version: '3'

info:
  companyName: "Open Download Manager contributors"
  productName: "Open Download Manager"
  productIdentifier: "app.opendownloadmanager.desktop"
  description: "Open-source download manager desktop shell"
  copyright: "(c) 2026 Open Download Manager contributors"
  comments: "ODM desktop MVP (v0.5)"
  version: "0.5.0"

dev_mode:
  root_path: .
  log_level: warn
  debounce: 1000
  ignore:
    dir:
      - .git
      - node_modules
      - frontend
      - bin
    file:
      - .DS_Store
      - .gitignore
      - .gitkeep
      - "*_test.go"
    watched_extension:
      - "*.go"
      - "*.js"
      - "*.ts"
    git_ignore: true
  executes:
    - cmd: wails3 build DEV=true
      type: blocking
    - cmd: wails3 task common:dev:frontend
      type: background
    - cmd: wails3 task run
      type: primary
      exit_policy: shutdown

fileAssociations: []

other: []
