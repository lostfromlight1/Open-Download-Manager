<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>ODM</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main>
      <h1>Open Download Manager</h1>
      <p id="status" class="muted">Checking host…</p>
      <label class="row">
        <input type="checkbox" id="interceptDownloads" />
        Send browser downloads to ODM
      </label>
      <label class="row">
        <input type="checkbox" id="forwardCookies" />
        Forward session cookies for intercepted downloads
      </label>
      <label class="row">
        <input type="checkbox" id="captureClicks" />
        Capture http(s) link clicks (optional)
      </label>
      <p class="hint">
        Enable browser integration in the ODM desktop Settings and set a
        download folder first. Cookie handoff is one-shot and not stored by
        ODM; after a restart you may need to intercept again. Chrome/Edge need
        your extension ID pasted in Settings.
      </p>
      <p id="lastError" class="error" hidden></p>
      <button type="button" id="refresh">Refresh status</button>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
